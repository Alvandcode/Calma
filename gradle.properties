org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=false

# Override global gradle.properties TLS restriction that breaks dl.google.com
systemProp.https.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# KSP needs single worker to avoid "Future was not completed yet"
org.gradle.workers.max=1

# Disable KSP incremental to avoid "Future was not completed yet" bug
ksp.incremental=false