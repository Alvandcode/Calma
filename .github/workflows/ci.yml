name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          build-tools: 35.0.0
          cmdline-tools: latest

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calma-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release:
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          build-tools: 35.0.0
          cmdline-tools: latest

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build release APK
        env:
          CALMA_STORE_FILE: ${{ secrets.CALMA_STORE_FILE }}
          CALMA_STORE_PASSWORD: ${{ secrets.CALMA_STORE_PASSWORD }}
          CALMA_KEY_ALIAS: ${{ secrets.CALMA_KEY_ALIAS }}
          CALMA_KEY_PASSWORD: ${{ secrets.CALMA_KEY_PASSWORD }}
        run: |
          echo "$CALMA_STORE_FILE" | base64 -d > calma-release.keystore
          ./gradlew assembleRelease --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}